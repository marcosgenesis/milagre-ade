name: Install dependencies
description: Set up Node.js and restore node_modules for this lockfile from the cache, running npm ci only on a miss.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
    # Every install hook (Electron's binary, node-pty's helper, the mobile patches) writes inside node_modules,
    # so a cached tree for the same lockfile is what npm ci would produce. A miss installs and saves it.
    - id: cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    # Electron fetches its binary on first use; fetch it now so the saved tree has it and warm runs skip the download.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: node node_modules/electron/install.js
