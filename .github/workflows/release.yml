name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
      - name: Test agent runner
        run: npm run test:agent
      - name: Test release safeguards
        run: npm run test:release
      - name: Check Apple release credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Create release and tag
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find created release tag
        id: release
        shell: bash
        run: |
          tag="$(git tag --points-at HEAD --sort=-version:refname | grep '^v' | head -n 1 || true)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Release tag: $tag"
          else
            echo "No new release was created for this commit."
          fi

  package-macos:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Apple notarization authentication
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const email = process.env.APPLE_ID
          const password = process.env.APPLE_APP_SPECIFIC_PASSWORD
          const team = process.env.APPLE_TEAM_ID
          const formatOK = /^[a-zA-Z0-9]{4}(?:-[a-zA-Z0-9]{4}){3}$/.test(password.trim())
          console.log('App-specific password has the expected format: ' + formatOK)
          console.log('Credentials have outer whitespace: ' + [email, password, team].some(value => value !== value.trim()))
          if (!formatOK) {
            console.error('Copy the app-specific password value generated by Apple, including its hyphens, into APPLE_APP_SPECIFIC_PASSWORD.')
            process.exit(1)
          }
          const result = spawnSync('xcrun', ['notarytool', 'history', '--apple-id', email.trim(), '--password', password.trim(), '--team-id', team.trim(), '--output-format', 'json'], { encoding: 'utf8' })
          if (result.status !== 0) {
            console.error(/401/.test(result.stderr + result.stdout) ? 'Apple rejected the configured credentials (HTTP 401).' : 'Apple authentication check failed (exit ' + result.status + ').')
            process.exit(1)
          }
          console.log('Apple accepted the configured notarization credentials.')
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build macOS installers
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/with-apple-credentials.cjs npm run package:mac -- --${{ matrix.arch }} --config.extraMetadata.version="${RELEASE_TAG#v}" --config.forceCodeSigning=true --config.dmg.sign=true
      - name: Notarize and staple disk images
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/with-apple-credentials.cjs bash -e -o pipefail <<'NOTARIZE'
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT
          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$result"
            node -e '
              const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              if (result.status !== "Accepted") {
                console.error(`Apple notarization failed: ${result.status} (submission ${result.id})`);
                process.exit(1);
              }
            ' "$result"
            xcrun stapler staple "$dmg"
          done
          NOTARIZE
      - name: Verify macOS signatures, notarization and disk images
        shell: bash
        run: |
          for app in release/mac*/Milagre.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            hdiutil verify "$dmg"
          done
      - name: Upload macOS installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" release/*.dmg release/*.zip --clobber
