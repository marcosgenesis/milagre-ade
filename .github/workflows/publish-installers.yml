# Signed installers remain drafts until selected platforms pass native checks.
name: Publish installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release candidate to package and publish (e.g. v0.21.0)
        required: true
        type: string
      platforms:
        description: Platforms to publish; macos+linux needs Linux repository credentials, all also needs Windows signing
        type: choice
        options:
          - macos
          - macos+linux
          - all
        default: macos
        required: true
      initialize_linux_repository:
        description: "First Linux publication only: start a new package map"
        type: boolean
        default: false
        required: false
permissions:
  contents: write
concurrency:
  group: publish-installers
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  package-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      tag: ${{ inputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      channel: latest
      require_draft: true
      publish: true
      platforms: ${{ inputs.platforms }}
    needs: prepare
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  package-windows:
    if: inputs.platforms == 'all'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - &a1
        name: Check out released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - &a2
        name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Require Windows signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: if (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD) { throw 'Configure WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD before publishing Windows installers' }
      - name: Install dependencies
        run: npm ci
      - name: Test Windows agent protocol
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-timeout=60000 packages/core/src/agents/codex-provider.test.cjs
      - name: Test Windows runtime
        timeout-minutes: 15
        run: node --test --test-reporter=tap --test-timeout=180000 packages/core/src/windows-runtime.test.cjs apps/daemon/src/windows-transport.test.cjs packages/core/src/agents/process-tree.test.cjs packages/core/src/ownership.test.cjs
      - name: Build signed Windows installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:win -- --config.extraMetadata.version="${RELEASE_TAG#v}" --config.forceCodeSigning=true
      - name: Verify installer Authenticode
        shell: pwsh
        run: |-
          Get-ChildItem release/Milagre-Setup-*-x64.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }
          }
      - name: Install and exercise Windows NSIS
        shell: pwsh
        run: |-
          $installer = (Get-ChildItem release/Milagre-Setup-*-x64.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Milagre Installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $executable = Join-Path $destination 'Milagre.exe'
          if (!(Test-Path $executable)) { throw 'Installed executable is missing' }
          node scripts/test-desktop.cjs --packaged $executable
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop check failed' }
      - name: Stage signed Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows
          path: |-
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
  package-linux:
    if: contains(inputs.platforms, 'linux') || inputs.platforms == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      MILAGRE_LINUX_SIGNING_KEY: ${{ secrets.LINUX_REPOSITORY_KEY_FINGERPRINT }}
    steps:
      - *a1
      - *a2
      - name: Require Linux signing credentials
        env:
          PRIVATE_KEY: ${{ secrets.LINUX_REPOSITORY_PRIVATE_KEY }}
        run: test -n "$PRIVATE_KEY" && test -n "$MILAGRE_LINUX_SIGNING_KEY"
      - name: Install Linux tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg xvfb desktop-file-utils libgbm1 libgtk-3-0 libnss3 libasound2t64
      - name: Install dependencies
        run: npm ci
      - name: Build Linux installers
        run: npm run package:linux -- --config.extraMetadata.version="${RELEASE_TAG#v}"
      # As on macOS: electron-builder writes only the stable feed, so beta installs read a copy and move to this release.
      - name: Mirror the stable feed to the beta channel
        run: |-
          test -f release/latest-linux.yml || { echo "::error::release/latest-linux.yml was not generated; there is no stable feed to mirror to beta."; exit 1; }
          cp release/latest-linux.yml release/beta-linux.yml
      - name: Exercise installed Linux desktop
        run: |-
          sudo apt-get install -y ./release/*.deb
          desktop-file-validate /usr/share/applications/milagre.desktop
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/test-desktop.cjs --packaged /opt/Milagre/milagre
      - name: Import repository signing key
        env:
          PRIVATE_KEY: ${{ secrets.LINUX_REPOSITORY_PRIVATE_KEY }}
        run: |-
          export GNUPGHOME="$RUNNER_TEMP/milagre-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf "%s" "$PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Retain previous package downloads
        if: "!inputs.initialize_linux_repository"
        run: node scripts/fetch-package-map.cjs "$RUNNER_TEMP/milagre-repository-maps"
      - name: Sign RPM and generate signed repositories
        run: |-
          previous=()
          if [ -f "$RUNNER_TEMP/milagre-repository-maps/package-map.json" ]; then previous=(--previous "$RUNNER_TEMP/milagre-repository-maps/package-map.json" --previous-metadata "$RUNNER_TEMP/milagre-repository-maps/immutable-metadata.json"); fi
          node scripts/generate-linux-repository.cjs --tag "$RELEASE_TAG" --artifacts release --output release/linux-repository --sign-rpm "${previous[@]}"
          node scripts/finalize-update-feeds.cjs --tag "$RELEASE_TAG" --platform linux
          tar -C release/linux-repository -czf release/milagre-linux-repository.tar.gz .
      - name: Verify signed Linux repository bundle
        run: node scripts/verify-linux-repository.cjs --directory release/linux-repository --tag "$RELEASE_TAG" --fingerprint "$MILAGRE_LINUX_SIGNING_KEY" --artifacts release
      - name: Install and exercise signed Fedora RPM
        run: |-
          docker build --platform linux/amd64 -f scripts/linux-runtime.Dockerfile -t milagre-fedora-check scripts
          mkdir -p "$RUNNER_TEMP/milagre-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/milagre-source"
          docker run --rm --platform linux/amd64 --cap-add=SYS_ADMIN --security-opt seccomp=unconfined -v "$RUNNER_TEMP/milagre-source:/source:ro" -v "$PWD/release:/installers:ro" -v "$PWD/release/linux-repository/archive-keyring.asc:/public-key.asc:ro" milagre-fedora-check bash /source/scripts/test-linux-rpm.sh /source /installers /public-key.asc
      - name: Exercise Linux AppImage payload
        run: |-
          "release/Milagre-${RELEASE_TAG#v}-x86_64.AppImage" --appimage-extract > /dev/null
          xvfb-run -a node scripts/test-desktop.cjs --packaged squashfs-root/AppRun
      - name: Stage signed Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-linux
          path: |-
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/latest-linux.yml
            release/beta-linux.yml
            release/milagre-linux-repository.tar.gz
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: if [ -n "$GNUPGHOME" ]; then gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"; fi
  publish-all:
    if: inputs.platforms == 'all'
    needs:
      - package-macos
      - package-windows
      - package-linux
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - *a1
      - *a2
      - name: Install metadata dependencies
        run: npm ci --ignore-scripts
      - name: Collect signed installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-*
          merge-multiple: true
          path: release
      - name: Generate final installer checksums and manifests
        run: npm run package:managers -- --tag "$RELEASE_TAG" --platform all
      - name: Require complete updater feeds
        run: node scripts/finalize-update-feeds.cjs --tag "$RELEASE_TAG" --check
      - name: Upload all platforms and publish draft
        run: |-
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb release/*.rpm release/*.blockmap release/latest*.yml release/beta-mac.yml release/beta-linux.yml release/milagre-linux-repository.tar.gz release/package-managers/SHA256SUMS release/package-managers/homebrew/milagre.rb release/package-managers/winget/Milagre.Milagre.yaml --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
  publish-macos-linux:
    if: inputs.platforms == 'macos+linux'
    needs:
      - package-macos
      - package-linux
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - *a1
      - *a2
      - name: Install metadata dependencies
        run: npm ci --ignore-scripts
      - name: Collect signed installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-*
          merge-multiple: true
          path: release
      - name: Generate final installer checksums and manifests
        run: npm run package:managers -- --tag "$RELEASE_TAG" --platform macos,linux
      - name: Require complete updater feeds
        run: |-
          for feed in latest-mac.yml beta-mac.yml latest-linux.yml beta-linux.yml; do
            test -f "release/$feed" || { echo "::error::release/$feed is missing"; exit 1; }
          done
          node scripts/finalize-update-feeds.cjs --tag "$RELEASE_TAG" --platform macos,linux --check
      - name: Upload macOS and Linux and publish draft
        run: |-
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.rpm release/*.blockmap release/latest-mac.yml release/beta-mac.yml release/latest-linux.yml release/beta-linux.yml release/milagre-linux-repository.tar.gz release/package-managers/SHA256SUMS release/package-managers/homebrew/milagre.rb --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
