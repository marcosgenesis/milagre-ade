# Native verification only: unsigned test artifacts, no release or deployment.
name: Windows readiness
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: windows-readiness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview:windows') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DO_NOT_TRACK: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Capture native desktop screenshots
        shell: pwsh
        run: '"MILAGRE_SCREENSHOT_DIR=$env:RUNNER_TEMP/windows-readiness-screenshots" >> $env:GITHUB_ENV'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Windows runtime, ownership and authenticated IPC
        timeout-minutes: 15
        run: node --test --test-reporter=tap --test-timeout=180000 packages/core/src/windows-runtime.test.cjs apps/daemon/src/windows-transport.test.cjs packages/core/src/agents/process-tree.test.cjs packages/core/src/ownership.test.cjs packages/core/src/agents/ports.test.cjs packages/core/src/pull-request.test.cjs packages/core/src/terminals.test.cjs
      - name: Test Windows provider protocol
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-timeout=60000 packages/core/src/agents/codex-provider.test.cjs
      - name: Exercise a real npm launcher
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'Agent CLI Test'
          npm install --global --prefix $prefix --no-audit --no-fund @openai/codex@0.160.0
          if ($LASTEXITCODE -ne 0) { throw 'Test CLI installation failed' }
          node scripts/test-windows-cli.cjs $prefix
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows CLI check failed' }
      - name: Build unsigned NSIS candidate
        run: npm run package:win
      - name: Verify installation, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installation.ps1
      - name: Generate and verify Windows package metadata
        run: npm run package:managers -- --tag v0.1.0 --platform windows
      - name: Upload native desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-readiness-evidence
          path: ${{ runner.temp }}/windows-readiness-screenshots
          if-no-files-found: ignore
          retention-days: 7
