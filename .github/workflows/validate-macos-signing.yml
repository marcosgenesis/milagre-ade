name: Validate macOS signing
on:
  push:
    branches:
      - codex/macos-signing
permissions:
  contents: read
jobs:
  verify-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS installers
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac -- --${{ matrix.arch }}
          --config.extraMetadata.version="0.9.1-signing-check"
          --config.forceCodeSigning=true --config.dmg.sign=true
      - name: Notarize and staple disk images
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          result="$(mktemp)"

          trap 'rm -f "$result"' EXIT

          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$result"
            node -e '
              const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              if (result.status !== "Accepted") {
                console.error(`Apple notarization failed: ${result.status} (submission ${result.id})`);
                process.exit(1);
              }
            ' "$result"
            xcrun stapler staple "$dmg"
          done
      - name: Verify macOS signatures, notarization and disk images
        shell: bash
        run: |
          for app in release/mac*/Milagre.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            hdiutil verify "$dmg"
          done
