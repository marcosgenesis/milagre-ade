# Turns a release candidate into a real release. Run it from the Actions tab with the candidate's
# tag: it builds both macOS architectures in one job — electron-builder then writes a single
# latest-mac.yml naming every installer, which the app's auto-updater reads from the release —
# notarizes and verifies them, attaches them to the draft, and only then publishes it. The release
# stays a draft until the installers and latest-mac.yml are attached, so installed apps never see
# a release they can't update to.
name: Publish installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release candidate to package and publish (e.g. v0.21.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-installers
  cancel-in-progress: false

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Apple release credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Check Apple notarization authentication
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const email = process.env.APPLE_ID
          const password = process.env.APPLE_APP_SPECIFIC_PASSWORD
          const team = process.env.APPLE_TEAM_ID
          const formatOK = /^[a-zA-Z0-9]{4}(?:-[a-zA-Z0-9]{4}){3}$/.test(password.trim())
          console.log('App-specific password has the expected format: ' + formatOK)
          console.log('Credentials have outer whitespace: ' + [email, password, team].some(value => value !== value.trim()))
          if (!formatOK) {
            console.error('Copy the app-specific password value generated by Apple, including its hyphens, into APPLE_APP_SPECIFIC_PASSWORD.')
            process.exit(1)
          }
          const result = spawnSync('xcrun', ['notarytool', 'history', '--apple-id', email.trim(), '--password', password.trim(), '--team-id', team.trim(), '--output-format', 'json'], { encoding: 'utf8' })
          if (result.status !== 0) {
            console.error(/401/.test(result.stderr + result.stdout) ? 'Apple rejected the configured credentials (HTTP 401).' : 'Apple authentication check failed (exit ' + result.status + ').')
            process.exit(1)
          }
          console.log('Apple accepted the configured notarization credentials.')
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build macOS installers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/with-apple-credentials.cjs npm run package:mac -- --x64 --arm64 --config.extraMetadata.version="${RELEASE_TAG#v}" --config.forceCodeSigning=true --config.dmg.sign=true
      - name: Notarize and staple disk images
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/with-apple-credentials.cjs bash -e -o pipefail <<'NOTARIZE'
          for dmg in release/*.dmg; do
            node scripts/notarize-dmg.cjs "$dmg"
          done
          NOTARIZE
      - name: Verify macOS signatures, notarization and disk images
        shell: bash
        run: |
          for app in release/mac*/Milagre.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            hdiutil verify "$dmg"
          done
      - name: Upload installers and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f release/latest-mac.yml ]; then
            echo "::error::release/latest-mac.yml was not generated; without it installed apps cannot discover this update."
            exit 1
          fi
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
