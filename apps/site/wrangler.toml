name = "milagre-site"
main = "worker/worker.ts"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "milagre.cloud", custom_domain = true },
  { pattern = "www.milagre.cloud", custom_domain = true },
  # milagre.dev belongs to another Cloudflare account; it reaches us as a Cloudflare for SaaS custom hostname
  { pattern = "milagre.dev/*", zone_name = "milagre.cloud" },
  { pattern = "www.milagre.dev/*", zone_name = "milagre.cloud" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# Optional secret: wrangler secret put GITHUB_TOKEN (public-read, raises the GitHub API rate limit)
