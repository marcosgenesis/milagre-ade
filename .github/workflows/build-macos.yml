# Signed macOS build for the Publish workflow. It stages the installers-macos artifact; Publish uploads it.
name: Build macOS
on:
  workflow_call:
    inputs:
      tag:
        description: Release candidate tag to check out (vX.Y.Z)
        type: string
        required: true
      version:
        description: Version written into the app, without the leading v (X.Y.Z or X.Y.Z-beta.N)
        type: string
        required: true
      channel:
        description: Update channel the build publishes to (latest or beta)
        type: string
        default: latest
      require_draft:
        description: Require the tag to be a stable draft release
        type: boolean
        default: true
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Require a stable draft release
        if: inputs.require_draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          node -e 'if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_TAG)) process.exit(1)'
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Check Apple release credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Check Apple notarization authentication
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const email = process.env.APPLE_ID
          const password = process.env.APPLE_APP_SPECIFIC_PASSWORD
          const team = process.env.APPLE_TEAM_ID
          const formatOK = /^[a-zA-Z0-9]{4}(?:-[a-zA-Z0-9]{4}){3}$/.test(password.trim())
          console.log('App-specific password has the expected format: ' + formatOK)
          console.log('Credentials have outer whitespace: ' + [email, password, team].some(value => value !== value.trim()))
          if (!formatOK) {
            console.error('Copy the app-specific password value generated by Apple, including its hyphens, into APPLE_APP_SPECIFIC_PASSWORD.')
            process.exit(1)
          }
          const result = spawnSync('xcrun', ['notarytool', 'history', '--apple-id', email.trim(), '--password', password.trim(), '--team-id', team.trim(), '--output-format', 'json'], { encoding: 'utf8' })
          if (result.status !== 0) {
            console.error(/401/.test(result.stderr + result.stdout) ? 'Apple rejected the configured credentials (HTTP 401).' : 'Apple authentication check failed (exit ' + result.status + ').')
            process.exit(1)
          }
          console.log('Apple accepted the configured notarization credentials.')
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build macOS installers
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/with-apple-credentials.cjs npm run package:mac -- --x64 --arm64 --config.extraMetadata.version="${VERSION}" --config.publish.channel="${CHANNEL}" --config.forceCodeSigning=true --config.dmg.sign=true
      # electron-builder writes only the current channel's feed for the github provider, so a stable
      # build copies latest-mac.yml to beta-mac.yml; beta installs then move to the stable release.
      - name: Mirror the stable feed to the beta channel
        if: inputs.channel == 'latest'
        shell: bash
        run: |
          if [ ! -f release/latest-mac.yml ]; then
            echo "::error::release/latest-mac.yml was not generated; there is no stable feed to mirror to beta."
            exit 1
          fi
          cp release/latest-mac.yml release/beta-mac.yml
      - name: Notarize and staple disk images
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/with-apple-credentials.cjs bash -e -o pipefail <<'NOTARIZE'
          for dmg in release/*.dmg; do
            node scripts/notarize-dmg.cjs "$dmg"
          done
          NOTARIZE
      - name: Verify macOS signatures, notarization and disk images
        shell: bash
        run: |
          for app in release/mac*/Milagre.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            hdiutil verify "$dmg"
          done
      - name: Exercise signed macOS app
        run: |-
          app=$(node -p 'process.arch === "arm64" ? "release/mac-arm64/Milagre.app" : "release/mac/Milagre.app"')
          node scripts/test-desktop.cjs --packaged "$app"
          node scripts/verify-packaged-simulator-helper.cjs "$app"
      - name: Refresh feeds after DMG notarization
        env:
          FEED_TAG: v${{ inputs.version }}
        run: node scripts/finalize-update-feeds.cjs --tag "$FEED_TAG" --platform macos
      - name: Stage signed macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-macos
          path: |-
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/beta-mac.yml
          if-no-files-found: error
