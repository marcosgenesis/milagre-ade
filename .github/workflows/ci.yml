name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - name: Detect which parts of the repository changed
        id: filter
        # Pushes to main always run every job; the filter needs a PR base to compare against.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Check lockfile sources and integrity
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Install dependencies
        run: npm ci
      - name: Verify package signatures
        run: npm audit signatures
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dead code
        run: npm run knip
      - name: Typecheck mobile
        run: npm run typecheck:mobile
      - name: Typecheck relay
        run: npm run typecheck:relay
      - name: Lint mobile
        run: npm run lint --workspace @milagre/mobile
      - name: Build renderer
        run: npm run build:renderer --workspace milagre
      - name: Test
        run: npm test -- --unit
  native-tests:
    name: native-tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test Windows agent protocol
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-timeout=60000 packages/core/src/agents/codex-provider.test.cjs
      - name: Test Windows runtime and pipe security
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 15
        run: node --test --test-reporter=tap --test-timeout=180000 packages/core/src/windows-runtime.test.cjs apps/daemon/src/windows-transport.test.cjs packages/core/src/agents/process-tree.test.cjs packages/core/src/ownership.test.cjs
      - name: Install Linux repository tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg
      - name: Test real Linux repository signing
        if: matrix.os == 'ubuntu-latest'
        run: |-
          export GNUPGHOME="$RUNNER_TEMP/milagre-test-key"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Milagre CI fixture' rsa3072 sign 1d
          MILAGRE_LINUX_SIGNING_KEY=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          export MILAGRE_LINUX_SIGNING_KEY
          MILAGRE_LINUX_REPOSITORY_INTEGRATION=1 node --test scripts/linux-repository.test.cjs
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  desktop-checks:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install display and Electron libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libgtk-3-0 libnss3 libasound2t64 lsof ffmpeg
      - run: npm ci
      - name: Allow Electron's sandbox in the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Electron checks
        env:
          MILAGRE_SCREENSHOT_DIR: ${{ runner.temp }}/electron-screenshots
          LIBGL_ALWAYS_SOFTWARE: "1"
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a -s "-screen 0 1600x1200x24 +extension GLX +render -noreset" npm test -- --electron
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-screenshots
          path: ${{ runner.temp }}/electron-screenshots
          if-no-files-found: ignore
          retention-days: 7
