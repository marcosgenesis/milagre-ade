# Every merge to main creates a release candidate: a tag and a DRAFT GitHub release with its notes,
# on a cheap Linux runner. No installer is built here. Draft releases are invisible to installed
# apps, so candidates never reach the auto-updater. To ship one, run the "Publish installers"
# workflow with the candidate's tag: it builds, notarizes and attaches the installers, then
# publishes the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
      - name: Test agent runner
        run: npm run test:agent
      - name: Test UI logic
        run: npm run test:ui
      - name: Test workspace and packaging contracts
        run: npm run test:monorepo
      - name: Test release safeguards
        run: npm run test:release
      - name: Create release candidate (tag and draft release)
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
