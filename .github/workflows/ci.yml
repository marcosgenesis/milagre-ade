name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - name: Detect which parts of the repository changed
        id: filter
        # Pushes to main always run every job; the filter needs a PR base to compare against.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
  # The JavaScript checks run as three parallel jobs; the `javascript` job below is the required check that gathers them.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Dead code
        run: npm run knip
      - name: Typecheck mobile
        run: npm run typecheck:mobile
      - name: Typecheck relay
        run: npm run typecheck:relay
      - name: Typecheck site
        run: npm run typecheck:site
      - name: Build site
        run: npm run build:site
      - name: Lint mobile
        run: npm run lint --workspace @milagre/mobile
      - name: Build renderer
        run: npm run build:renderer --workspace milagre
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check lockfile sources and integrity
        run: npx --yes lockfile-lint@5.0.1 --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Verify package signatures
        run: npm audit signatures
  unit:
    name: unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Test
        run: npm test -- --unit --shard ${{ matrix.shard }}/${{ strategy.job-total }}
  javascript:
    # The required check: green only when every JavaScript job passed.
    if: always()
    needs: [static, supply-chain, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every JavaScript job to have passed
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.supply-chain.result }} ${{ needs.unit.result }}
        run: |
          echo "static, supply-chain, unit: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
  native-tests:
    name: native-tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The Windows tests load only core and the daemon, so they install just those (150 MB, not 1.7 GB) and cache it.
      # The Linux leg runs Node built-ins only and installs nothing.
      - name: Restore core and daemon dependencies
        if: matrix.os == 'windows-latest'
        id: windows-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-core-daemon-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install core and daemon dependencies
        if: matrix.os == 'windows-latest' && steps.windows-cache.outputs.cache-hit != 'true'
        run: npm ci --workspace @milagre/core --workspace @milagre/daemon --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Test Windows agent protocol
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-timeout=60000 packages/core/src/agents/codex-provider.test.cjs
      - name: Test Windows runtime and pipe security
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 15
        run: node --test --test-reporter=tap --test-timeout=180000 packages/core/src/windows-runtime.test.cjs apps/daemon/src/windows-transport.test.cjs packages/core/src/agents/process-tree.test.cjs packages/core/src/ownership.test.cjs
      - name: Install Linux repository tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg
      - name: Test real Linux repository signing
        if: matrix.os == 'ubuntu-latest'
        run: |-
          export GNUPGHOME="$RUNNER_TEMP/milagre-test-key"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Milagre CI fixture' rsa3072 sign 1d
          MILAGRE_LINUX_SIGNING_KEY=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          export MILAGRE_LINUX_SIGNING_KEY
          MILAGRE_LINUX_REPOSITORY_INTEGRATION=1 node --test scripts/linux-repository.test.cjs
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  native-gate:
    # The required check for native tests. A skipped matrix never reports per-leg names, so this
    # job always runs: green when native-tests passed or was skipped, red when it failed or was cancelled.
    if: always()
    needs: [native-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native tests to have passed or been skipped
        env:
          RESULT: ${{ needs.native-tests.result }}
        run: |
          echo "native-tests: $RESULT"
          case "$RESULT" in success|skipped) exit 0 ;; *) exit 1 ;; esac
  desktop-checks:
    # The Electron checks run one at a time (each boots Vite and Electron), so they are split across runners.
    name: desktop-checks (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      # The runner image ships most of these; apt only runs for what is missing, since a slow mirror once took 12 minutes.
      # ffmpeg, the one the image lacks, is only for chat-titles' GIF, so only the shard that runs it installs it.
      - name: Install display and Electron libraries
        run: |
          packages="xvfb libgbm1 libgtk-3-0t64 libnss3 libasound2t64 lsof"
          if node scripts/test.cjs --electron --list --shard ${{ matrix.shard }}/${{ strategy.job-total }} | grep -q test-chat-titles; then packages="$packages ffmpeg"; fi
          missing=$(for package in $packages; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || echo "$package"
          done)
          echo "missing: ${missing:-none}"
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y --no-install-recommends $missing; fi
      - name: Allow Electron's sandbox in the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Electron checks
        env:
          MILAGRE_SCREENSHOT_DIR: ${{ runner.temp }}/electron-screenshots
          LIBGL_ALWAYS_SOFTWARE: "1"
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a -s "-screen 0 1600x1200x24 +extension GLX +render -noreset" npm test -- --electron --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-screenshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/electron-screenshots
          if-no-files-found: ignore
          retention-days: 7

  release:
    # Every CI-green push to main becomes a release candidate: a tag and a DRAFT GitHub release.
    # Stable installs never see drafts (they ask for GitHub's latest release). The tag does show in the releases
    # atom feed, so beta installs resolve their feed through the REST API instead (electron/release-channel.cjs).
    # The "Publish" workflow ships a candidate to beta or stable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'the-ptf/milagre-ade'
    needs: [javascript, native-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create release candidate (tag and draft release)
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
