name = "milagre-site"
main = "worker/worker.ts"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "milagre.cloud", custom_domain = true },
  { pattern = "www.milagre.cloud", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
