name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck mobile
        run: npm run typecheck:mobile
      - name: Typecheck relay
        run: npm run typecheck:relay
      - name: Test relay
        run: npm run test:relay
      - name: Lint mobile
        run: npm run lint --workspace @milagre/mobile
      - name: Test mobile transport
        run: npm run test:mobile
      - name: Build renderer
        run: npm run build:renderer --workspace milagre
      - name: Test agent runner
        run: npm run test:agent
      - name: Test UI logic
        run: npm run test:ui
      - name: Test workspace and packaging contracts
        run: npm run test:monorepo
      - name: Test release safeguards
        run: npm run test:release
